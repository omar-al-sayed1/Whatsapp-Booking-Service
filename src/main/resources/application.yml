# All configuration comes from environment variables (see .env.example). No defaults for secrets.
spring:
  application:
    name: clinic-reminders
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  messages:
    basename: messages
    fallback-to-system-locale: false

management:
  endpoints:
    web:
      exposure:
        include: health

whatsapp:
  client: cloud
  app-secret: ${WA_APP_SECRET:}
  verify-token: ${WA_VERIFY_TOKEN:}
  graph-version: ${WA_GRAPH_VERSION:}
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  base-url: https://graph.facebook.com
  # Pricing category of each template as approved by Meta (SPEC section 6).
  template-categories:
    appointment_reminder: utility
    appointment_reminder_soon: utility
  # Meta prices by the recipient's country calling code. Add markets from the rate card as needed.
  markets:
    "961": Rest of Middle East
  inbox:
    async: true
    sweep-interval: PT10S
    max-attempts: 5

reminders:
  scheduler:
    enabled: true
    # SPEC asks for every minute; 30 s keeps "sent within 2 minutes of due" comfortably.
    poll-interval: PT30S
    batch-size: 50
  # Language code each template was approved under in Meta, by patient language. Must match exactly.
  template-language-codes:
    ar: ar
    en: en
  # Quick-reply button labels of the approved reminder templates (SPEC section 6). Must match exactly.
  confirm-labels: [Confirm, تأكيد]
  cancel-labels: [Cancel, إلغاء]
