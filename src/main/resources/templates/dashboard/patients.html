<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{dashboard/layout :: page(~{::title}, 'patients', ~{::main})}">
<head><title th:text="#{patients.title}">Patients</title></head>
<body>
<main class="container">
    <header class="page-head">
        <div>
            <div class="eyebrow"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg><span th:text="#{patients.title}">Patients</span></div>
            <h1 th:text="#{patients.title}">Patients</h1>
        </div>
    </header>

    <!--/* Results update as you type; the plain GET still works without JS. */-->
    <form method="get" th:action="@{/patients}" class="big-search" role="search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" name="q" th:value="${q}" th:placeholder="#{patients.search}" th:aria-label="#{patients.search}"
               autocomplete="off" data-key="slash" dir="auto"
               th:hx-get="@{/patients}" hx-trigger="input changed delay:250ms, search" hx-target="#patient-results"
               hx-select="#patient-results" hx-swap="outerHTML" hx-push-url="true" hx-indicator=".big-search, #patient-results">
        <span class="htmx-indicator" aria-hidden="true"></span>
        <kbd class="kbd-hint">/</kbd>
    </form>

    <section id="patient-results" aria-live="polite">
        <div class="card empty" th:if="${patients.isEmpty()}">
            <span class="empty-icon"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg></span>
            <strong th:text="#{patients.empty}">No patients found.</strong>
            <p th:text="#{patients.hint}">Search by name or phone number.</p>
        </div>

        <th:block th:unless="${patients.isEmpty()}">
            <p class="results-note" th:text="#{patients.count(${total + ''})}">12 patients</p>
            <!--/*
              A card per patient: who (and delete), their next appointment or none, then Call and Book.
              Stacked rather than side by side, so nothing gets squeezed on a phone. "rows" is also what
              the next page brings as you scroll: its cards, then the loader for the page after.
            */-->
            <ul class="people">
                <th:block th:fragment="rows">
                <li class="person" th:each="p : ${patients}">
                    <div class="person-head">
                        <span class="avatar lg" th:style="'--hue:' + ${@avatars.hue(p.name())}" th:text="${@avatars.initials(p.name())}">RH</span>
                        <div class="person-main">
                            <strong th:text="${p.name()}">Rana</strong>
                            <div class="person-meta">
                                <span dir="ltr" th:text="${p.phoneE164()}">+96170123456</span>
                                <span class="tag" th:text="#{'language.' + ${p.language()}}">Arabic</span>
                            </div>
                        </div>
                        <form method="post" th:action="@{/patients/{id}/delete(id=${p.id()})}" th:data-confirm="#{patients.delete-confirm}"
                              th:if="${staff.doctorId() == null}">
                            <button type="submit" class="icon-btn ghost-danger" th:title="#{action.delete}" th:aria-label="#{action.delete}">
                                <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg></button>
                        </form>
                    </div>
                    <p class="family-note" th:if="${p.family()}">
                        <svg class="icon" aria-hidden="true"><use href="#i-users"/></svg><span th:text="#{patients.family(${p.family()})}">Same number as Karim Haddad</span></p>
                    <p class="opted-out-note" th:if="${p.optedOut()}">
                        <svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><span th:text="#{patients.opted-out}">Opted out (no messages)</span></p>

                    <!--/* Booked or not: the next appointment opens in the slide-over. */-->
                    <a class="next-appt booked" th:if="${p.next()}" data-drawer th:href="@{/appointments/{id}(id=${p.nextId()})}">
                        <span class="next-icon"><svg class="icon" aria-hidden="true"><use href="#i-today"/></svg></span>
                        <span class="next-text">
                            <span class="next-label" th:text="#{patients.next}">Next appointment</span>
                            <strong th:text="${p.next()}">Wed 21 Oct, 10:20 AM</strong>
                            <span class="next-doctor" th:text="${p.nextDoctor()}">Dr. Demo</span>
                        </span>
                        <svg class="icon flip-rtl next-go" aria-hidden="true"><use href="#i-chevron-right"/></svg>
                    </a>
                    <div class="next-appt none" th:unless="${p.next()}">
                        <span class="next-icon"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg></span>
                        <span class="next-text"><span th:text="#{patients.not-booked}">No upcoming appointment</span></span>
                    </div>

                    <div class="person-actions">
                        <a class="button sm" th:href="'tel:' + ${p.phoneE164()}">
                            <svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg><span th:text="#{attention.call}">Call</span></a>
                        <a class="button sm" th:classappend="${p.next() == null} ? 'primary'" data-drawer
                           th:href="@{/appointments/new(phone=${p.phoneE164()}, name=${p.name()})}">
                            <svg class="icon" aria-hidden="true"><use href="#i-calendar-plus"/></svg><span th:text="#{patients.book}">Book</span></a>
                    </div>
                </li>
                <li class="load-more" th:if="${nextPage != null}">
                    <div class="load-more-skeleton">
                        <th:block th:each="i : ${#numbers.sequence(1, 3)}"><div th:replace="~{dashboard/skeletons :: person}"></div></th:block>
                    </div>
                    <a class="load-more-link" th:href="@{/patients(q=${q}, page=${nextPage})}"
                       th:hx-get="@{/patients(q=${q}, page=${nextPage})}" hx-trigger="intersect once, click"
                       hx-target="closest .load-more" hx-swap="outerHTML" th:text="#{list.load-more}">Show more</a>
                </li>
                </th:block>
            </ul>
        </th:block>
    </section>
</main>
</body>
</html>
