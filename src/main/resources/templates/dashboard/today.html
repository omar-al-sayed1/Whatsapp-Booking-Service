<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{dashboard/layout :: page(~{::title}, 'today', ~{::main})}">
<head><title th:text="#{today.title}">Today</title></head>
<body>
<main class="container">
    <header class="page-head">
        <div>
            <div class="eyebrow">
                <span th:text="#{${relativeDayKey}(${relativeDayCount})}">Today</span>
                <span class="live" th:title="#{today.refreshes}"><span class="live-dot"></span><span th:text="#{today.live}">Live</span></span>
            </div>
            <h1 th:text="${dateLabel}">Tuesday 3 November 2026</h1>
        </div>
        <div class="head-actions">
            <nav class="segmented" th:aria-label="#{today.pick-date}">
                <a class="icon-btn" th:href="@{/(date=${previousDate})}" th:title="#{today.previous}" th:aria-label="#{today.previous}"
                   th:attr="data-key=${dir == 'rtl'} ? 'ArrowRight' : 'ArrowLeft'">
                    <svg class="icon flip-rtl" aria-hidden="true"><use href="#i-chevron-left"/></svg></a>
                <a th:href="@{/}" th:classappend="${isToday} ? 'current'" th:text="#{today.today}" data-key="t">Today</a>
                <span class="date-input button ghost icon-btn" th:title="#{today.pick-date}">
                    <svg class="icon" aria-hidden="true"><use href="#i-today"/></svg>
                    <input type="date" th:value="${date}" th:aria-label="#{today.pick-date}" th:attr="data-navigate-date=@{/(date='DATE')}">
                </span>
                <a class="icon-btn" th:href="@{/(date=${nextDate})}" th:title="#{today.next}" th:aria-label="#{today.next}"
                   th:attr="data-key=${dir == 'rtl'} ? 'ArrowLeft' : 'ArrowRight'">
                    <svg class="icon flip-rtl" aria-hidden="true"><use href="#i-chevron-right"/></svg></a>
            </nav>
            <a class="button primary" th:href="@{/appointments/new(date=${date})}" data-key="n" data-drawer>
                <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
                <span th:text="#{today.add}">Add appointment</span>
                <kbd class="kbd-hint">N</kbd>
            </a>
        </div>
    </header>
    <section th:replace="~{dashboard/today-list :: list}"></section>
</main>
</body>
</html>
