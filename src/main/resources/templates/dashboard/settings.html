<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{dashboard/layout :: page(~{::title}, 'settings', ~{::main})}">
<head><title th:text="#{settings.title}">Settings</title></head>
<body>
<main class="container">
    <header class="page-head">
        <div>
            <div class="eyebrow"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg><span th:text="#{settings.title}">Settings</span></div>
            <h1 th:text="#{settings.title}">Settings</h1>
        </div>
    </header>

    <!--/* One form for the clinic: every field is posted together, so nothing is switched off by accident. */-->
    <form method="post" th:action="@{/settings/clinic}">
        <div class="grid-2">
            <div class="stack">
                <section class="card">
                    <div class="section-head"><h2 th:text="#{settings.section.reminders}">Reminders</h2></div>
                    <label class="setting">
                        <span><strong th:text="#{settings.h24}">Send a reminder the day before</strong>
                            <span class="hint" th:text="#{settings.h24.hint}">Skipped when booked less than a day ahead.</span></span>
                        <input type="checkbox" class="switch" name="h24Enabled" value="true" th:checked="${h24Enabled}">
                    </label>
                    <label class="setting">
                        <span><strong th:text="#{settings.h2}">Send a reminder 2 hours before</strong>
                            <span class="hint" th:text="#{settings.h2.hint}">Skipped during quiet hours.</span></span>
                        <input type="checkbox" class="switch" name="h2Enabled" value="true" th:checked="${h2Enabled}">
                    </label>
                </section>
                <section class="card">
                    <div class="section-head"><h2 th:text="#{settings.default-language}">New patients' language</h2></div>
                    <p class="hint" th:text="#{settings.default-language.hint}">The language new patients get until they choose.</p>
                    <div class="radio-pills" role="radiogroup" th:aria-label="#{settings.default-language}">
                        <label><input type="radio" name="defaultLanguage" value="ar" th:checked="${defaultLanguage == 'ar'}">
                            <span th:text="#{language.ar}">Arabic</span></label>
                        <label><input type="radio" name="defaultLanguage" value="en" th:checked="${defaultLanguage == 'en'}">
                            <span th:text="#{language.en}">English</span></label>
                    </div>
                </section>
            </div>

            <section class="card">
                <div class="section-head"><h2 th:text="#{settings.section.info}">Info on WhatsApp</h2></div>
                <p class="hint" th:text="#{settings.contact.hint}">Sent to patients who tap Info on WhatsApp.</p>
                <div class="stack">
                    <label>
                        <span th:text="#{settings.address}">Address</span>
                        <textarea name="address" rows="2" th:maxlength="${contactMax}" th:text="${address}" data-preview="address"></textarea>
                    </label>
                    <label>
                        <span th:text="#{settings.hours-text}">Opening hours</span>
                        <textarea name="hoursText" rows="2" th:maxlength="${contactMax}" th:text="${hoursText}" data-preview="hours"></textarea>
                    </label>
                </div>
                <div class="preview-label" th:text="#{settings.preview}">Preview on WhatsApp</div>
                <div class="preview" aria-hidden="true">
                    <div class="bubble in">
                        <div th:hidden="${#strings.isEmpty(address)}" data-preview-line="address">
                            <span th:text="#{settings.preview.address}">Address:</span> <span data-preview-for="address" th:text="${address}">Main street</span></div>
                        <div th:hidden="${#strings.isEmpty(hoursText)}" data-preview-line="hours">
                            <span th:text="#{settings.preview.hours}">Opening hours:</span> <span data-preview-for="hours" th:text="${hoursText}">9 to 1</span></div>
                        <div th:hidden="${!#strings.isEmpty(address) or !#strings.isEmpty(hoursText)}" data-preview-empty
                             th:text="#{booking.info.none}">Please call us for our address and opening hours.</div>
                        <time>10:00</time>
                    </div>
                </div>
            </section>
        </div>
        <div class="form-actions spaced">
            <button type="submit" class="primary"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>
                <span th:text="#{action.save}">Save</span></button>
        </div>
    </form>

</main>
</body>
</html>
