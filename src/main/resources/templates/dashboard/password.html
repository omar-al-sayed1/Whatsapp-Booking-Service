<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{dashboard/layout :: page(~{::title}, 'password', ~{::main})}">
<head><title th:text="#{password.title}">Password</title></head>
<body>
<main class="container">
    <div class="centered">
        <section class="card">
            <span class="page-icon"><svg class="icon" aria-hidden="true"><use href="#i-key"/></svg></span>
            <h1 th:text="#{password.title}">Password</h1>
            <p class="muted" th:text="#{password.intro}">Choose a password only you know.</p>
            <form method="post" th:action="@{/account/password}" class="stack">
                <label><span th:text="#{password.current}">Current password</span>
                    <span class="field-icon">
                        <svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>
                        <input type="password" id="current-password" name="currentPassword" autocomplete="current-password" required dir="ltr">
                        <button type="button" class="reveal" data-reveal="current-password" aria-pressed="false" th:aria-label="#{login.show-password}">
                            <svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button>
                    </span>
                </label>
                <label><span th:text="#{password.new}">New password</span>
                    <span class="field-icon">
                        <svg class="icon" aria-hidden="true"><use href="#i-key"/></svg>
                        <input type="password" id="new-password" name="newPassword" autocomplete="new-password" minlength="10" required dir="ltr">
                        <button type="button" class="reveal" data-reveal="new-password" aria-pressed="false" th:aria-label="#{login.show-password}">
                            <svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button>
                    </span>
                    <span class="hint" th:text="#{password.hint}">At least 10 characters.</span>
                </label>
                <div class="form-actions">
                    <button type="submit" class="primary"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>
                        <span th:text="#{action.save}">Save</span></button>
                </div>
            </form>
        </section>
    </div>
</main>
</body>
</html>
