<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{dashboard/layout :: page(~{::title}, 'password', ~{::main})}">
<head><title th:text="#{password.title}">Password</title></head>
<body>
<main class="container narrow">
    <h1 th:text="#{password.title}">Password</h1>
    <section class="card">
        <form method="post" th:action="@{/account/password}" class="stack">
            <label><span th:text="#{password.current}">Current password</span>
                <input type="password" name="currentPassword" autocomplete="current-password" required></label>
            <label><span th:text="#{password.new}">New password</span>
                <input type="password" name="newPassword" autocomplete="new-password" minlength="10" required></label>
            <p class="muted" th:text="#{password.hint}">At least 10 characters.</p>
            <div class="buttons"><button type="submit" class="primary" th:text="#{action.save}">Save</button></div>
        </form>
    </section>
</main>
</body>
</html>
