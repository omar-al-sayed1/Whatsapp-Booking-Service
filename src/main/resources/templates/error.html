<!DOCTYPE html>
<!--/* Spring Boot's error page. Standalone and bilingual: the dashboard model isn't available here. */-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${status} ?: 'Error'">Error</title>
    <script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="error-page">
    <div class="centered">
        <section class="card">
            <div class="error-code" th:text="${status} ?: '500'">404</div>
            <h1 th:text="${status == 404} ? 'Page not found' : 'Something went wrong'">Something went wrong</h1>
            <p lang="ar" dir="rtl" class="muted" th:text="${status == 404} ? 'الصفحة غير موجودة' : 'حدث خطأ ما'">حدث خطأ ما</p>
            <a class="button primary" th:href="@{/}">Today · اليوم</a>
        </section>
    </div>
</main>
</body>
</html>
