# Reminder template parameters: the date ({{3}} of appointment_reminder) and the time.
# Patterns are java.time DateTimeFormatter patterns; ar-LB gives Levantine month names.
reminder.date-format=EEEE d MMMM
reminder.time-format=h:mm a

# Sent after a patient taps Cancel on a reminder. {0} doctor, {1} date, {2} time.
reminder.cancelled=تم إلغاء موعدك مع {0} يوم {1} الساعة {2}. راسلنا في أي وقت لحجز موعد جديد.
