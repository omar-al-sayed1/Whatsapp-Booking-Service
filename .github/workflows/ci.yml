name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Commits made on Windows lose the executable bit on mvnw.
      - run: chmod +x mvnw
      # Ubuntu runners ship with Docker, so the Testcontainers tests run here too.
      - run: ./mvnw -B verify
