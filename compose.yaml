# Local development database only. Production runs its own Postgres with real credentials (M7).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinicreminders
      POSTGRES_USER: clinicreminders
      POSTGRES_PASSWORD: clinicreminders
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicreminders -d clinicreminders"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
